# Suggested workflow configuration. No remote GitHub Actions run is claimed.
name: local-learning-lab-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python scripts/quality.py
      - run: python -m learning_service.train
      - run: python -m pytest --junitxml=evidence/pytest.xml
